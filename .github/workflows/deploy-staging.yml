
name: Deploy GovFlow AI Staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_STAGING to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: govflow-ai-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: ${{ inputs.confirmation == 'DEPLOY_STAGING' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migration

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Validate staging bundle
        run: bunx wrangler deploy --env staging --dry-run

      - name: Deploy staging only
        run: bunx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
